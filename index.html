<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>2048</title>
</head>
<body>
   
    <div id="canvas-container">
        <div id="swipe-area"></div>
        <canvas id="canvas"></canvas>
        <div id="toolbar" class="text">
            <div class="new-game-button">New game</div>
            <div id="new-high-score-message" class="text">New high score!</div>
        </div>
        <div id="hud" class="text">
            <div id="score">Score: 0</div>
            <div id="high-score">High Score: 0</div>
        </div>
        <div id="game-over" class="text">
            <span class="message">Game over</span>
            <span class="score">Score: <br> 0</span>
            <div class="new-game-button">New game</div>
        </div>
        <div id="blur"></div>
      
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="data.js"></script>
    <script src="hud.js"></script>
    <script src="utils.js"></script>
    <script src="tile.js"></script>
    <script src="grid.js"></script>
    <script src="main.js"></script>
    <script src="input.js"></script>
</body>
</html>
